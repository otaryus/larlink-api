services:
  postgres:
    image: postgres:17-alpine
    container_name: larlink-postgres
    environment:
      POSTGRES_DB: larlink
      POSTGRES_USER: larlink
      POSTGRES_PASSWORD: larlink2026
    ports:
      - "5433:5432"
    volumes:
      - larlink_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U larlink -d larlink"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  larlink_pgdata:
