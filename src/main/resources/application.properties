spring.application.name=api
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/larlink}
spring.datasource.username=${DB_USERNAME:larlink}
spring.datasource.password=${DB_PASSWORD:larlink2026}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAXIMUM_POOL_SIZE:2}
spring.datasource.hikari.minimum-idle=${DB_POOL_MINIMUM_IDLE:0}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
# spring.jpa.show-sql=false
app.jwt.secret=${JWT_SECRET:LarLink-local-development-secret-key-change-before-deploy-2026}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origin=${CORS_ORIGIN:http://localhost:5173}
app.testing-date.enabled=${TESTING_DATE_ENABLED:false}
app.testing-payments.enabled=${TESTING_PAYMENTS_ENABLED:false}
app.agent.email=${AGENT_EMAIL:}
app.agent.password=${AGENT_PASSWORD:}
app.agent.name=${AGENT_NAME:Agente LarLink}
app.ai.api-key=${OPENAI_API_KEY:}
app.ai.model=${OPENAI_MODEL:gpt-6-astra}
app.matching.ai.api-key=${DEEPSEEK_API_KEY:}
app.matching.ai.model=${DEEPSEEK_MODEL:deepseek-chat}
app.matching.ai.base-url=${DEEPSEEK_BASE_URL:https://api.deepseek.com}
spring.profiles.default=prod
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=4MB
